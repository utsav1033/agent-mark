[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-mark"
version = "2.0.0"
description = "Benchmark any tool-using AI agent: task success, tool path, latency and real $ cost"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Utsav Khairnar", email = "utsavkhairnar14@gmail.com"},
]
keywords = ["agents", "evaluation", "benchmark", "llm", "coding-agent", "tool-use"]

# Core install is tiny: enough to benchmark pi, any CLI agent (command adapter),
# or your own Python adapter on the bundled coding suite.
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# LLM-judged suites (gmail/github/notion) and the reference Composio agent.
composio = [
    "google-genai>=1.0",
    "composio-anthropic>=0.13",
    "anthropic>=0.40",
]

[project.urls]
Homepage = "https://github.com/utsav1033/agent-mark"

[project.scripts]
agent-mark = "agent_mark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_mark"]
